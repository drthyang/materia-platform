# The ISOTROPY oracle (opt-in, ADR 0005): MATERIA's isotropy subgroups at the
# Phase-1 k-points and Phase 2's cell-multiplying ones (Pm-3m X, M, R; Fm-3m
# L, W), and Phase 4's mode amplitudes of decomposed supercell children
# (SrTiO3 R-3c and Pnma, NiAs to MnP-type Pnma), and Phase 5's irrep labels
# (MATERIA's generic ones against ISOTROPY's Miller-Love labels, by character,
# the magnetic page's non-abelian zone-boundary points included), against the
# ISOTROPY Suite (iso.byu.edu). ISOTROPY for Linux states no licence, so it is
# downloaded here at run time and never committed, and neither are the labels
# it prints (ADRs 0004, 0005). Run it from the Actions tab or
# `gh workflow run isotropy-oracle.yml`.
name: ISOTROPY oracle

on:
  workflow_dispatch:
    inputs:
      only_labels:
        description: "Run only the irrep-label step"
        type: boolean
        default: false
      label_cases:
        description: "Label cases to run (a regular expression on their names; empty: all)"
        type: string
        default: ""

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download ISOTROPY for Linux (not committed)
        run: |
          mkdir -p "$RUNNER_TEMP/isobyu"
          curl -fsSL -o "$RUNNER_TEMP/isobyu/iso.zip" https://iso.byu.edu/iso.zip
          unzip -q -o "$RUNNER_TEMP/isobyu/iso.zip" -d "$RUNNER_TEMP/isobyu"
          ISO_BIN="$(find "$RUNNER_TEMP/isobyu" -type f -name iso | head -1)"
          test -n "$ISO_BIN"
          chmod +x "$ISO_BIN"
          ls -la "$(dirname "$ISO_BIN")"
          echo "ISODATA=$(dirname "$ISO_BIN")/" >> "$GITHUB_ENV"
      - name: Compare isotropy subgroups
        if: ${{ !inputs.only_labels }}
        env:
          ISOTROPY_ORACLE: "1"
        run: npx vitest run src/core/crystal/irreps/isotropyOracle.test.ts
      - name: Mode amplitudes against ISOTROPY's modes
        if: ${{ !inputs.only_labels }}
        env:
          ISOTROPY_ORACLE: "1"
        run: npx vitest run src/core/crystal/irreps/modeAmplitudeOracle.test.ts
      - name: Irrep labels against ISOTROPY's, by character
        env:
          ISOTROPY_ORACLE: "1"
          ORACLE_CASES: ${{ inputs.label_cases }}
        run: npx vitest run src/core/crystal/irreps/irrepLabelOracle.test.ts
